name: CI
on: [ push, pull_request ]
jobs:
  Build:

    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        node-version: [ 24 ]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Verify submodule revisions
      shell: bash
      run: |
        status="$(git submodule status --recursive)"
        printf '%s\n' "$status"
        if printf '%s\n' "$status" | grep -Eq '^[-+U]'; then
          echo "::error::Submodule checkout does not match the recorded commit"
          exit 1
        fi
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Setup project
      uses: bpmn-io/actions/setup@latest
    - name: Build (with coverage)
      if: runner.os == 'Linux'
      env:
        COVERAGE: 1
        TEST_BROWSERS: ChromeHeadless
      run: npm run all
    - name: Build
      if: runner.os != 'Linux'
      env:
        TEST_BROWSERS: ChromeHeadless
      run: npm run all
    - name: Save coverage report
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-linux
        path: coverage/lcov.info
        if-no-files-found: error
    - name: Check Codecov configuration
      if: runner.os == 'Linux'
      id: codecov
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      run: |
        if [ -n "$CODECOV_TOKEN" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::CODECOV_TOKEN is not configured; coverage is available as a workflow artifact."
        fi
    - name: Upload coverage to Codecov
      if: runner.os == 'Linux' && steps.codecov.outputs.configured == 'true'
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
